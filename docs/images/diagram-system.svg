<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="940" fill="#f8f9fa" rx="12"/>
  <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">LogiQED System Architecture (MVP)</text>
  <text x="600" y="65" font-size="13" text-anchor="middle" fill="#6c757d">Three evidence layers: Trust, State, Evidence</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5e35b1"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e65100"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- ============================================================
       SOURCES
       ============================================================ -->
  <text x="140" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">SOURCES</text>

  <rect x="40" y="140" width="200" height="45" rx="8" fill="#007bff"/>
  <text x="140" y="167" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Driver Browser / PWA</text>

  <rect x="40" y="200" width="200" height="45" rx="8" fill="#007bff"/>
  <text x="140" y="227" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Mobile App (3rd-party)</text>

  <rect x="40" y="260" width="200" height="45" rx="8" fill="#007bff"/>
  <text x="140" y="287" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Onboard Tracker (TPM)</text>

  <!-- ============================================================
       LAYER 1 — TRUST
       ============================================================ -->
  <rect x="300" y="115" width="400" height="215" rx="10" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <text x="500" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b3d91">LAYER 1 — TRUST (Ingest API)</text>

  <g font-size="11" text-anchor="middle" fill="#212529">
    <rect x="315" y="155" width="115" height="38" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="372" y="178">Verify key + signature</text>

    <rect x="440" y="155" width="115" height="38" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="497" y="173">Convert to</text>
    <text x="497" y="187">EPCIS 2.0</text>

    <rect x="565" y="155" width="115" height="38" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="622" y="178">Dedup</text>

    <rect x="315" y="205" width="180" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="405" y="223">Authenticate: 7 dimensions</text>
    <text x="405" y="240">→ own assurance E0-E5</text>

    <rect x="505" y="205" width="175" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="592" y="223">Validate EPCIS structure</text>
    <text x="592" y="240">Apply Trust Policy (event)</text>

    <rect x="315" y="262" width="365" height="42" rx="6" fill="#e3f2fd" stroke="#64b5f6"/>
    <text x="497" y="280">Normalize and enqueue to Bounded Channel</text>
    <text x="497" y="296" font-size="10" fill="#6c757d">all source formats converted to EPCIS 2.0 here</text>
  </g>

  <!-- ============================================================
       TRANSPORT — Bounded Channel
       ============================================================ -->
  <rect x="760" y="160" width="410" height="45" rx="10" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="965" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">TRANSPORT — Bounded Channel</text>
  <text x="965" y="198" font-size="10" text-anchor="middle" fill="#5d4037">Channel&lt;T&gt; · in-memory · backpressure · one channel, two sides</text>

  <!-- ============================================================
       OPERATOR — Dispatcher UI
       ============================================================ -->
  <text x="140" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">OPERATOR</text>

  <rect x="40" y="440" width="200" height="45" rx="8" fill="#5e35b1"/>
  <text x="140" y="467" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Dispatcher UI</text>

  <!-- ============================================================
       LAYER 2 — STATE
       ============================================================ -->
  <rect x="300" y="390" width="870" height="180" rx="10" fill="#f3e5f5" stroke="#ba68c8" stroke-width="2"/>
  <text x="735" y="415" font-size="13" font-weight="bold" text-anchor="middle" fill="#4a148c">LAYER 2 — STATE (Event Orchestrator)</text>

  <g font-size="11" text-anchor="middle" fill="#212529">
    <rect x="320" y="430" width="190" height="45" rx="6" fill="#fff" stroke="#ce93d8"/>
    <text x="415" y="450">Event Orchestrator</text>
    <text x="415" y="466" font-size="10" fill="#6c757d">one State Machine per tripId</text>

    <rect x="530" y="430" width="190" height="45" rx="6" fill="#fff" stroke="#ce93d8"/>
    <text x="625" y="450">Route State Machine</text>
    <text x="625" y="466" font-size="10" fill="#6c757d">speed · geofence · time</text>

    <rect x="740" y="430" width="190" height="45" rx="6" fill="#fff" stroke="#ce93d8"/>
    <text x="835" y="450">Enrichment Decider</text>
    <text x="835" y="466" font-size="10" fill="#6c757d">pure function</text>

    <rect x="950" y="430" width="190" height="45" rx="6" fill="#fff" stroke="#ce93d8"/>
    <text x="1045" y="450">On-Demand Oracle</text>
    <text x="1045" y="466" font-size="10" fill="#6c757d">Traffic / Weather / Warehouse</text>

    <rect x="320" y="495" width="820" height="55" rx="6" fill="#ede7f6" stroke="#b39ddb"/>
    <text x="730" y="515">On claim close → Evidence Builder is triggered. On route close → Evidence Builder is triggered.</text>
    <text x="730" y="535" font-size="10" fill="#6c757d">Checkpoints to SQL after every transition · Redis is a read-through projection</text>
  </g>

  <!-- ============================================================
       LAYER 3 — EVIDENCE
       ============================================================ -->
  <rect x="300" y="590" width="870" height="195" rx="10" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="735" y="615" font-size="13" font-weight="bold" text-anchor="middle" fill="#1b5e20">LAYER 3 — EVIDENCE</text>

  <g font-size="11" text-anchor="middle" fill="#212529">
    <rect x="320" y="630" width="190" height="45" rx="6" fill="#fff" stroke="#a5d6a7"/>
    <text x="415" y="650">SLA Engine</text>
    <text x="415" y="666" font-size="10" fill="#6c757d">pause in working calendar</text>

    <rect x="530" y="630" width="190" height="45" rx="6" fill="#fff" stroke="#a5d6a7"/>
    <text x="625" y="650">Evidence Builder</text>
    <text x="625" y="666" font-size="10" fill="#6c757d">claim · route · dispute</text>

    <rect x="740" y="630" width="190" height="45" rx="6" fill="#fff" stroke="#a5d6a7"/>
    <text x="835" y="650">Evidence Graph</text>
    <text x="835" y="666" font-size="10" fill="#6c757d">independence · E5 check</text>

    <rect x="950" y="630" width="190" height="45" rx="6" fill="#fff" stroke="#a5d6a7"/>
    <text x="1045" y="650">Proof Engine</text>
    <text x="1045" y="666" font-size="10" fill="#6c757d">Aligned Layer (mock MVP)</text>

    <rect x="320" y="695" width="820" height="75" rx="6" fill="#c8e6c9" stroke="#81c784"/>
    <text x="730" y="718" font-weight="bold">Three evidence levels</text>
    <text x="730" y="736" font-size="10">Clean route → trip Evidence Root + Arweave anchor</text>
    <text x="730" y="751" font-size="10">Incident → claim package base + claim anchor (confirmed or rejected)</text>
    <text x="730" y="766" font-size="10">Disputed → retroactive corroboration + ZK proof (E3+) + new anchor</text>
  </g>

  <!-- ============================================================
       STORAGE (grouped, with layer attribution)
       ============================================================ -->
  <rect x="40" y="590" width="230" height="240" rx="10" fill="#eceff1" stroke="#78909c" stroke-width="2"/>
  <text x="155" y="615" font-size="13" font-weight="bold" text-anchor="middle" fill="#37474f">STORAGE</text>

  <rect x="55" y="630" width="200" height="35" rx="6" fill="#ff9800"/>
  <text x="155" y="647" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">Redis (cache)</text>
  <text x="155" y="662" font-size="9" text-anchor="middle" fill="#5d4037">used by LAYER 2</text>

  <rect x="55" y="680" width="200" height="35" rx="6" fill="#4caf50"/>
  <text x="155" y="697" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">MS SQL (record)</text>
  <text x="155" y="712" font-size="9" text-anchor="middle" fill="#e8f5e9">used by LAYER 2 + LAYER 3</text>

  <rect x="55" y="730" width="200" height="35" rx="6" fill="#9c27b0"/>
  <text x="155" y="747" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">Aligned Layer (proof)</text>
  <text x="155" y="762" font-size="9" text-anchor="middle" fill="#f3e5f5">used by LAYER 3</text>

  <rect x="55" y="780" width="200" height="35" rx="6" fill="#607d8b"/>
  <text x="155" y="797" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">Arweave (anchors)</text>
  <text x="155" y="812" font-size="9" text-anchor="middle" fill="#eceff1">used by LAYER 3</text>

  <!-- ============================================================
       ARROWS
       ============================================================ -->

  <!-- Sources → LAYER 1 -->
  <line x1="240" y1="162" x2="300" y2="162" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="222" x2="300" y2="222" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="282" x2="300" y2="282" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 1 → TRANSPORT -->
  <line x1="700" y1="182" x2="760" y2="182" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- TRANSPORT → LAYER 2 -->
  <line x1="965" y1="205" x2="965" y2="370" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Dispatcher UI → LAYER 2 (horizontal) -->
  <line x1="240" y1="462" x2="300" y2="462" stroke="#5e35b1" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- LAYER 2 → LAYER 3 (vertical) -->
  <line x1="735" y1="570" x2="735" y2="590" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- LAYER 2 → STORAGE (route: lower part of L2 → down to top center of STORAGE) -->
  <line x1="300" y1="520" x2="155" y2="520" stroke="#6c757d" stroke-width="2"/>
  <line x1="155" y1="520" x2="155" y2="590" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3 → STORAGE (short straight horizontal, at vertical center of STORAGE) -->
  <line x1="300" y1="710" x2="270" y2="710" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <text x="600" y="870" font-size="10" font-style="italic" text-anchor="middle" fill="#6c757d">Redis is a cache for active routes, not the system of record. MS SQL is the record. Arweave stores trip anchors, claim anchors, and full package anchors.</text>
  <text x="600" y="888" font-size="10" font-style="italic" text-anchor="middle" fill="#6c757d">ZK proof is generated only on dispute request, and only when the claim level is E3 or higher.</text>
  <text x="600" y="906" font-size="10" font-style="italic" text-anchor="middle" fill="#6c757d">In MVP, exceptions are reported by the driver. The system does not poll external APIs continuously.</text>
</svg>