<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1150" height="640" fill="#f8f9fa" rx="12"/>
  <text x="575" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">LogiQED System Architecture (MVP)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>

  <!-- Клиенты -->
  <g>
    <text x="110" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">CLIENTS</text>
    <rect x="20" y="135" width="180" height="45" rx="8" fill="#007bff"/>
    <text x="110" y="162" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Driver Browser</text>
    <rect x="20" y="215" width="180" height="45" rx="8" fill="#007bff"/>
    <text x="110" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Tracker App</text>
    <rect x="20" y="295" width="180" height="45" rx="8" fill="#007bff"/>
    <text x="110" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Dispatcher UI</text>
  </g>

  <!-- Монолит -->
  <rect x="350" y="80" width="380" height="530" rx="12" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <text x="540" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b3d91">MODULAR MONOLITH</text>

  <g font-size="12" text-anchor="middle" fill="#212529">
    <rect x="370" y="130" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="450" y="156">SignalR Hub</text>
    <rect x="550" y="130" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="630" y="156">Telemetry API</text>

    <rect x="370" y="210" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="450" y="236">Event Orchestrator</text>
    <rect x="550" y="210" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="630" y="236">SLA Engine</text>

    <rect x="370" y="290" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="450" y="316">Evidence Builder</text>
    <rect x="550" y="290" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="630" y="316">Identity Manager</text>

    <rect x="370" y="370" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="450" y="396">Dispatch Dashboard</text>
    <rect x="550" y="370" width="160" height="42" rx="6" fill="#fff" stroke="#90caf9"/>
    <text x="630" y="396">Notifications</text>

    <rect x="370" y="450" width="340" height="45" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
    <text x="540" y="470">Shared Kernel</text>
    <text x="540" y="486" font-size="10" fill="#6c757d">interfaces / domain events / common types</text>

    <rect x="370" y="540" width="340" height="45" rx="6" fill="#f3e5f5" stroke="#ce93d8"/>
    <text x="540" y="560" fill="#6a1b9a">Lean 4</text>
    <text x="540" y="576" font-size="10" fill="#6a1b9a">Formal Verification</text>
  </g>

  <!-- Внешние сервисы -->
  <g>
    <text x="950" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">INFRASTRUCTURE</text>
    <rect x="830" y="135" width="220" height="45" rx="8" fill="#ff9800"/>
    <text x="940" y="162" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Redis</text>
    <rect x="830" y="215" width="220" height="45" rx="8" fill="#ffc107"/>
    <text x="940" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#212529">RabbitMQ</text>
    <rect x="830" y="295" width="220" height="45" rx="8" fill="#4caf50"/>
    <text x="940" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">MS SQL</text>
    <rect x="830" y="375" width="220" height="45" rx="8" fill="#e91e63"/>
    <text x="940" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Seq + Grafana</text>
    <rect x="830" y="455" width="220" height="45" rx="8" fill="#9c27b0"/>
    <text x="940" y="482" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Aligned Layer</text>
    <rect x="830" y="535" width="220" height="45" rx="8" fill="#607d8b"/>
    <text x="940" y="562" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">Arweave</text>
  </g>

  <!-- Стрелки: клиенты -> монолит -->
  <line x1="200" y1="157" x2="350" y2="157" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="237" x2="350" y2="237" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="317" x2="350" y2="317" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Стрелки: монолит -> инфраструктура -->
  <line x1="730" y1="157" x2="830" y2="157" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="237" x2="830" y2="237" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="317" x2="830" y2="317" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="397" x2="830" y2="397" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="477" x2="830" y2="477" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="557" x2="830" y2="557" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Подписи стрелок -->
  <g font-size="10" fill="#495057" stroke="#f8f9fa" stroke-width="3" paint-order="stroke" stroke-linecap="round" stroke-linejoin="round" text-anchor="middle">
    <text x="275" y="150">SignalR</text>
    <text x="275" y="230">HTTPS + Protobuf</text>
    <text x="275" y="310">REST</text>
    <text x="780" y="150">Telemetry API</text>
    <text x="780" y="230">Orchestrator</text>
    <text x="780" y="310">EF Core</text>
    <text x="780" y="390">OTEL / metrics</text>
    <text x="780" y="470">Evidence</text>
    <text x="780" y="550">Package + proof</text>
  </g>

  <!-- Примечание -->
  <text x="540" y="630" font-size="10" font-style="italic" text-anchor="middle" fill="#6c757d">Redis is a cache/buffer, not the system of record. Arweave stores final Evidence Packages only.</text>
</svg>