<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="Arial, Helvetica, sans-serif">
  <rect width="700" height="480" fill="#f8f9fa" rx="12"/>
  <text x="350" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Trust Levels E0–E5</text>

  <!-- E5 -->
  <rect x="180" y="50" width="340" height="60" rx="8" fill="#6f42c1"/>
  <text x="350" y="78" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E5 — Multiple Independent</text>
  <text x="350" y="97" font-size="11" text-anchor="middle" fill="#e9d5ff">≥3 independent trusted sources</text>

  <!-- E4 -->
  <rect x="150" y="120" width="400" height="60" rx="8" fill="#9c27b0"/>
  <text x="350" y="148" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E4 — Hardware-backed + Corroborated</text>
  <text x="350" y="167" font-size="11" text-anchor="middle" fill="#f3e5f5">attested + verified by second source</text>

  <!-- E3 -->
  <rect x="120" y="190" width="460" height="60" rx="8" fill="#17a2b8"/>
  <text x="350" y="218" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E3 — Attested Device</text>
  <text x="350" y="237" font-size="11" text-anchor="middle" fill="#cceef5">TPM / Secure Element / OEM certification</text>

  <!-- E2 -->
  <rect x="90" y="260" width="520" height="60" rx="8" fill="#ffc107"/>
  <text x="350" y="288" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">E2 — Signed Software Source</text>
  <text x="350" y="307" font-size="11" text-anchor="middle" fill="#212529">binary signature, app version, manifest</text>

  <!-- E1 -->
  <rect x="60" y="330" width="580" height="60" rx="8" fill="#fd7e14"/>
  <text x="350" y="358" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E1 — Authenticated External API</text>
  <text x="350" y="377" font-size="11" text-anchor="middle" fill="#ffe5cc">valid API key, verified endpoint</text>

  <!-- E0 -->
  <rect x="30" y="400" width="640" height="60" rx="8" fill="#dc3545"/>
  <text x="350" y="428" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">E0 — User Input</text>
  <text x="350" y="447" font-size="11" text-anchor="middle" fill="#f8d7da">manual entry, no attestation</text>

  <!-- Стрелка наверх -->
  <line x1="35" y1="430" x2="35" y2="80" stroke="#495057" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="22" y="255" font-size="11" font-weight="bold" fill="#495057" transform="rotate(-90, 22, 255)">SOURCE ASSURANCE →</text>
</svg>