<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="320" fill="#f8f9fa" rx="12"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Route State Machine</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>

  <!-- Row 1: Created -> InTransit -> SegmentEntered -->
  <g font-size="12" text-anchor="middle" fill="#212529">
    <rect x="40" y="100" width="140" height="50" rx="25" fill="#17a2b8"/>
    <text x="110" y="130" fill="#fff">Created</text>

    <rect x="250" y="100" width="140" height="50" rx="25" fill="#007bff"/>
    <text x="320" y="130" fill="#fff">InTransit</text>

    <rect x="460" y="100" width="150" height="50" rx="25" fill="#ffc107"/>
    <text x="535" y="130" fill="#212529">SegmentEntered</text>
  </g>

  <g stroke="#6c757d" stroke-width="2" fill="none">
    <line x1="180" y1="125" x2="240" y2="125" marker-end="url(#arrow)"/>
    <line x1="390" y1="125" x2="450" y2="125" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" fill="#6c757d" text-anchor="middle">
    <text x="210" y="115">start</text>
    <text x="420" y="115">segment A-B</text>
  </g>

  <!-- Row 2: SLA_PAUSED -> SLA_RESUMED -> SegmentExited -> Completed -->
  <g font-size="12" text-anchor="middle" fill="#212529">
    <rect x="60" y="230" width="160" height="50" rx="25" fill="#dc3545"/>
    <text x="140" y="260" fill="#fff">SLA_PAUSED</text>

    <rect x="290" y="230" width="160" height="50" rx="25" fill="#fd7e14"/>
    <text x="370" y="260" fill="#fff">SLA_RESUMED</text>

    <rect x="520" y="230" width="150" height="50" rx="25" fill="#6f42c1"/>
    <text x="595" y="260" fill="#fff">SegmentExited</text>

    <rect x="740" y="230" width="130" height="50" rx="25" fill="#28a745"/>
    <text x="805" y="260" fill="#fff">Completed</text>
  </g>

  <g stroke="#6c757d" stroke-width="2" fill="none">
    <line x1="220" y1="255" x2="280" y2="255" marker-end="url(#arrow)"/>
    <line x1="450" y1="255" x2="510" y2="255" marker-end="url(#arrow)"/>
    <line x1="670" y1="255" x2="730" y2="255" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" fill="#6c757d" text-anchor="middle">
    <text x="250" y="245">TrafficExited</text>
    <text x="480" y="245">segment end</text>
    <text x="700" y="245">route done</text>
  </g>

  <!-- Вниз: SegmentEntered -> SLA_PAUSED -->
  <line x1="535" y1="150" x2="140" y2="220" stroke="#dc3545" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="330" y="180" font-size="10" fill="#dc3545" text-anchor="middle">TrafficEntered → SLA paused</text>

  <!-- Возврат: SLA_RESUMED -> SegmentEntered (на случай повторного трафика) -->
  <line x1="370" y1="230" x2="535" y2="160" stroke="#fd7e14" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="485" y="185" font-size="9" fill="#fd7e14" text-anchor="middle">traffic again</text>

  <!-- Примечание -->
  <text x="450" y="310" font-size="10" font-style="italic" text-anchor="middle" fill="#6c757d">SLA pause = measured interval between TrafficEntered and TrafficExited</text>
</svg>