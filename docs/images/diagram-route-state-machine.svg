<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="1300" height="520" fill="#f8f9fa" rx="12"/>
  <text x="650" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">Route State Machine</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>

  <!-- Верхний ряд -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="50" y="120" width="150" height="50" rx="25" fill="#17a2b8"/>
    <text x="125" y="150" fill="#fff">Created</text>

    <rect x="300" y="120" width="150" height="50" rx="25" fill="#007bff"/>
    <text x="375" y="150" fill="#fff">InTransit</text>

    <rect x="550" y="120" width="150" height="50" rx="25" fill="#ffc107"/>
    <text x="625" y="150" fill="#333">SegmentEntered</text>

    <rect x="800" y="120" width="150" height="50" rx="25" fill="#6f42c1"/>
    <text x="875" y="150" fill="#fff">SegmentExited</text>

    <rect x="1050" y="120" width="150" height="50" rx="25" fill="#28a745"/>
    <text x="1125" y="150" fill="#fff">Completed</text>
  </g>

  <!-- Нижний ряд (SLA блоки) -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="550" y="320" width="150" height="50" rx="25" fill="#dc3545"/>
    <text x="625" y="350" fill="#fff">SLA_PAUSED</text>

    <rect x="800" y="320" width="150" height="50" rx="25" fill="#fd7e14"/>
    <text x="875" y="350" fill="#fff">SLA_RESUMED</text>
  </g>

  <!-- Верхние горизонтальные стрелки -->
  <g stroke="#495057" stroke-width="2.5" fill="none">
    <line x1="200" y1="145" x2="290" y2="145" marker-end="url(#arrow)"/>
    <line x1="450" y1="145" x2="540" y2="145" marker-end="url(#arrow)"/>
    <line x1="950" y1="145" x2="1040" y2="145" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#495057" text-anchor="middle">
    <text x="245" y="132">start</text>
    <text x="495" y="132">segment A-B</text>
    <text x="995" y="132">route done</text>
  </g>

  <!-- Вертикальные стрелки -->
  <g stroke="#495057" stroke-width="2.5" fill="none">
    <!-- SegmentEntered -> SLA_PAUSED -->
    <line x1="625" y1="170" x2="625" y2="310" marker-end="url(#arrow)"/>
    <!-- SLA_RESUMED -> SegmentExited -->
    <line x1="875" y1="320" x2="875" y2="180" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#495057">
    <text x="640" y="240">TrafficEntered</text>
    <text x="890" y="240">segment end</text>
  </g>

  <!-- Горизонтальная стрелка между SLA блоками -->
  <g stroke="#495057" stroke-width="2.5" fill="none">
    <line x1="700" y1="345" x2="790" y2="345" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" fill="#495057" text-anchor="middle">
    <text x="745" y="332">TrafficExited</text>
  </g>

  <!-- Обратный переход: SLA_RESUMED -> SLA_PAUSED (прямоугольный маршрут) -->
  <polyline points="875,370 875,420 625,420 625,380" fill="none" stroke="#fd7e14" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="750" y="412" font-size="12" fill="#fd7e14" text-anchor="middle">traffic again (optional)</text>

  <!-- Примечание -->
  <text x="650" y="510" font-size="11" font-style="italic" text-anchor="middle" fill="#6c757d">SLA pause = measured interval between TrafficEntered and TrafficExited</text>
</svg>