<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <style>
      .title {
        font: 700 48px Arial, sans-serif;
        fill: #0F172A;
      }
      .subtitle {
        font: 400 24px Arial, sans-serif;
        fill: #526270;
      }
      .section {
        font: 700 28px Arial, sans-serif;
        fill: #0F172A;
      }
      .item {
        font: 400 23px Arial, sans-serif;
        fill: #263746;
      }
      .small {
        font: 400 20px Arial, sans-serif;
        fill: #61717E;
      }
      .accent {
        fill: #16A34A;
      }
      .card {
        fill: #FFFFFF;
        stroke: #D7E0E7;
        stroke-width: 2;
      }
      .badge {
        fill: #ECFDF5;
        stroke: #16A34A;
        stroke-width: 2;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="90" y="90" class="title">LogiQED security architecture</text>
  <text x="90" y="135" class="subtitle">
    Store less. Trust less. Limit the value of a breach.
  </text>

  <!-- Main flow -->
  <rect x="90" y="190" width="1420" height="90" rx="20" fill="#F0FDF4" stroke="url(#accent)" stroke-width="3"/>
  <text x="800" y="245" text-anchor="middle" class="section">
    A database breach should not become full operational access
  </text>

  <!-- Left card -->
  <rect x="90" y="340" width="680" height="390" rx="24" class="card" filter="url(#shadow)"/>
  <rect x="90" y="340" width="680" height="9" rx="5" fill="#16A34A"/>

  <text x="130" y="405" class="section">1. Storage minimization</text>
  <text x="130" y="445" class="small">Reduce what an attacker can obtain.</text>

  <circle cx="145" cy="505" r="7" class="accent"/>
  <text x="170" y="513" class="item">Tracker keys: hash only</text>

  <circle cx="145" cy="555" r="7" class="accent"/>
  <text x="170" y="563" class="item">TOTP secrets: encrypted</text>

  <circle cx="145" cy="605" r="7" class="accent"/>
  <text x="170" y="613" class="item">Recovery codes: hashed</text>

  <circle cx="145" cy="655" r="7" class="accent"/>
  <text x="170" y="663" class="item">Raw telemetry: retention-limited</text>

  <circle cx="145" cy="705" r="7" class="accent"/>
  <text x="170" y="713" class="item">Evidence: hashes and commitments</text>

  <!-- Right card -->
  <rect x="830" y="340" width="680" height="390" rx="24" class="card" filter="url(#shadow)"/>
  <rect x="830" y="340" width="680" height="9" rx="5" fill="#0284C7"/>

  <text x="870" y="405" class="section">2. Operational controls</text>
  <text x="870" y="445" class="small">Limit what stolen credentials can do.</text>

  <circle cx="885" cy="505" r="7" fill="#0284C7"/>
  <text x="910" y="513" class="item">New device or IP: adaptive 2FA</text>

  <circle cx="885" cy="555" r="7" fill="#0284C7"/>
  <text x="910" y="563" class="item">Sessions: server-side revocation</text>

  <circle cx="885" cy="605" r="7" fill="#0284C7"/>
  <text x="910" y="613" class="item">Trusted devices: checks still apply</text>

  <circle cx="885" cy="655" r="7" fill="#0284C7"/>
  <text x="910" y="663" class="item">Refresh tokens: rotation enabled</text>

  <circle cx="885" cy="705" r="7" fill="#0284C7"/>
  <text x="910" y="713" class="item">Admin actions: audited</text>

  <!-- Bottom result -->
  <rect x="300" y="785" width="1000" height="62" rx="31" class="badge"/>
  <text x="800" y="825" text-anchor="middle" class="section" font-size="25">
    Security is architecture, not a checkbox.
  </text>

  <!-- Branding -->
  <text x="90" y="880" class="small">LogiQED • Verifiable freight evidence</text>
</svg>